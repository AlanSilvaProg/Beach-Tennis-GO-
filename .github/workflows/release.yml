name: Release

# O Unity nao roda no runner (exigiria licenca): a build (WebGLBuild/) e gerada localmente com
# scripts/build-release.sh e versionada. Este workflow empacota essa build e cria o GitHub Release.
#  - Tag v*: release normal (a versao e a propria tag).
#  - Push nas branches listadas em `branches` abaixo (new-model, new-model-baseline): pre-release "<branch>-build-<n>" com a build versionada nessa branch (a tag e criada no commit do push).
#    Para outra branch gerar release tambem, acrescente o nome dela em branches.
on:
  push:
    tags: ['v*']
    branches: [new-model, new-model-baseline]
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag/versao do release (ex.: v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            BRANCH="$(echo "${{ github.ref_name }}" | tr '/' '-')"
            echo "version=${BRANCH}-build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate build
        run: |
          test -f WebGLBuild/index.html
          ls WebGLBuild/Build/*.wasm*

      - name: Zip build
        run: |
          cd WebGLBuild
          zip -qr -X "$GITHUB_WORKSPACE/beach-tennis-go-webgl-${{ steps.v.outputs.version }}.zip" . -x "*.DS_Store"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.v.outputs.prerelease == 'true' }}
          name: Beach Tennis GO! ${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: beach-tennis-go-webgl-${{ steps.v.outputs.version }}.zip
