name: Deploy to GitHub Pages

# O Unity nao roda no runner (exigiria licenca): a build (WebGLBuild/) e gerada localmente (Tools > Beach Tennis GO > Build WebGL
# ou scripts/build-release.sh) e versionada. A cada push em main, este workflow publica a pasta WebGLBuild/ no GitHub Pages.
# Configuracao unica no repositorio: Settings > Pages > Build and deployment > Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate build
        run: |
          test -f WebGLBuild/index.html
          ls WebGLBuild/Build/*.wasm*
          test -f WebGLBuild/StreamingAssets/Voice/en/index.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: WebGLBuild

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
