<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b4a86">
    <title>{{{ PRODUCT_NAME }}}</title>
    <!-- Poki SDK: must come from Poki's official CDN (it is not bundled). -->
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
    <link rel="icon" id="favicon" type="image/webp">
    <style>
      /* Everything the loading screen needs is inline (logo, blurred background), so it shows before any other file is downloaded. */
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b4a86; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #0b4a86; outline: none; }

      #loading { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; transition: opacity .45s ease; }
      #loading.done { opacity: 0; pointer-events: none; }
      /* Full-screen background: the thumbnail, tiny and stretched, then blurred. The negative inset hides the blurred edges. */
      #loading-bg { position: absolute; inset: -8%; background: #0b4a86 url(data:image/jpeg;base64,%%THUMB_DATA%%) center / cover no-repeat; filter: blur(16px) saturate(1.15) brightness(.9); }
      #loading-shade { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,20,50,.05) 0%, rgba(0,20,50,.45) 100%); }
      #loading-logo { position: relative; width: min(72vw, 46vh, 420px); height: auto; aspect-ratio: %%LOGO_W%% / %%LOGO_H%%; filter: drop-shadow(0 6px 16px rgba(0,0,0,.35)); animation: float 3.2s ease-in-out infinite; }
      #loading-bar { position: relative; margin-top: min(4vh, 28px); width: min(64vw, 360px); height: 16px; border-radius: 10px; background: rgba(0,20,50,.45); box-shadow: inset 0 0 0 2px rgba(255,255,255,.6), 0 4px 12px rgba(0,0,0,.25); overflow: hidden; }
      #loading-fill { height: 100%; width: 0%; border-radius: 10px; background: linear-gradient(180deg, #ffe066 0%, #ffb300 55%, #ff7a00 100%); box-shadow: 0 0 10px rgba(255,179,0,.8); transition: width .25s ease-out; }
      #loading-error { position: relative; margin-top: 14px; padding: 0 16px; max-width: 80vw; color: #fff; font: 14px/1.3 sans-serif; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,.6); display: none; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @media (prefers-reduced-motion: reduce) { #loading-logo { animation: none; } }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div id="loading-bg"></div>
      <div id="loading-shade"></div>
      <img id="loading-logo" alt="{{{ PRODUCT_NAME }}}" width="%%LOGO_W%%" height="%%LOGO_H%%" src="data:image/webp;base64,%%LOGO_DATA%%">
      <div id="loading-bar"><div id="loading-fill"></div></div>
      <div id="loading-error"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#loading-fill");
      document.querySelector("#favicon").href = document.querySelector("#loading-logo").src; // same inline image, not a second copy

      // ---- Poki page API ----------------------------------------------------------------------------------------------------------
      // The game talks to Poki through Poki's official Unity wrapper (PokiUnitySDK.cs + PokiSDKBridge.jslib). On poki.com the page and these
      // functions come from Poki's loader (built from index.json); this is the same API for every other host (local tests, GitHub Pages), so the
      // game code is identical. It is safe without the SDK (blocked, offline): the game goes on and breaks end at once.
      (function () {
        function realSdk() { return window.PokiSDK && typeof window.PokiSDK.init === "function" ? window.PokiSDK : null; }
        var noop = function () {};
        if (!realSdk()) {
          // SDK script not available: harmless stand-in so the wrapper's direct PokiSDK.* calls never throw.
          window.PokiSDK = {
            init: function () { return Promise.reject(new Error("no Poki SDK")); }, setDebug: noop,
            gameLoadingStart: noop, gameLoadingFinished: noop, gameplayStart: noop, gameplayStop: noop,
            commercialBreak: function () { return Promise.resolve(); }, rewardedBreak: function () { return Promise.resolve(false); },
            customEvent: noop, measure: noop, getURLParam: function () { return ""; }, openExternalLink: noop,
            displayAd: noop, destroyAd: noop, getLanguage: function () { return ""; }, isAdBlocked: function () { return true; },
            logError: noop, movePill: noop
          };
        }
        function isLocalHost() { return /^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname); }
        // Ads only make sense inside Poki (a Poki iframe); in local tests the SDK runs in debug mode with simulated ads; elsewhere the game goes straight on.
        function adsEnabled() {
          try { return !!realSdk() && (window.self !== window.top || /poki/i.test(location.hostname) || isLocalHost()); } catch (e) { return !!realSdk(); }
        }
        var unityName = null, queue = [];
        // The page may answer before Unity has finished starting (window.unityGame is set at the end): queue until it can be reached.
        function toUnity(method, arg) { queue.push([method, arg]); flush(); }
        function flush() {
          if (!window.unityGame || !unityName) return;
          while (queue.length) {
            var m = queue.shift();
            try { if (m[1] === undefined) window.unityGame.SendMessage(unityName, m[0]); else window.unityGame.SendMessage(unityName, m[0], m[1]); } catch (e) { }
          }
        }
        window.flushPokiMessages = flush;

        window.initPokiBridge = function (name) {
          unityName = name;
          try { if (realSdk() && isLocalHost()) window.PokiSDK.setDebug(true); } catch (e) { }
          Promise.resolve().then(function () { return window.PokiSDK.init(); }).then(function () { toUnity("ready"); }, function () { toUnity("adblock"); });
        };
        window.commercialBreak = function () {
          var done = false;
          function finish() { if (done) return; done = true; clearTimeout(timer); toUnity("commercialBreakCompleted"); }
          var timer = setTimeout(finish, 90000);
          if (!adsEnabled()) { finish(); return; }
          Promise.resolve(window.PokiSDK.commercialBreak(function () { })).then(finish, finish);
        };
        window.rewardedBreak = function (opts) {
          var done = false;
          function finish(ok) { if (done) return; done = true; clearTimeout(timer); toUnity("rewardedBreakCompleted", ok ? "true" : "false"); }
          var timer = setTimeout(function () { finish(false); }, 90000);
          if (!adsEnabled()) { finish(false); return; } // no ad, no reward
          Promise.resolve(window.PokiSDK.rewardedBreak(function () { }, opts)).then(function (success) { finish(!!success); }, function () { finish(false); });
        };
        // Not used by this game, but the wrapper's plugin calls them by name.
        window.shareableURL = function () { toUnity("shareableURLRejected"); };
        window.getUser = function () { toUnity("getUserRejected"); };
        window.getToken = function () { toUnity("getTokenRejected"); };
        window.login = function () { toUnity("loginRejected"); };

        // The game is inside a page that scrolls: space, arrows and the wheel must not move it.
        window.addEventListener("keydown", function (e) {
          var t = e.target;
          if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
          if (e.key === "ArrowDown" || e.key === "ArrowUp" || e.key === " ") e.preventDefault();
        });
        window.addEventListener("wheel", function (e) { e.preventDefault(); }, { passive: false });
      })();

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: function (msg, type) { if (type == 'error') showError(msg); },
      };

      function showError(message) {
        var box = document.querySelector("#loading-error");
        box.textContent = message;
        box.style.display = "block";
        loading.classList.remove("done");
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = (100 * progress) + "%";   // 0..1 while the data, framework and code are downloaded and started
        }).then(function (instance) {
          window.unityGame = instance;            // the Poki page API talks back to the game through this
          window.flushPokiMessages();
          fill.style.width = "100%";
          loading.classList.add("done");
          setTimeout(function () { loading.style.display = "none"; }, 500);
        }).catch(function (message) {
          showError(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
